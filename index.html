<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn Chinese | Vocabulary Practice</title><style>
:root{--blue:#2563eb;--ink:#172033;--muted:#667085;--line:#e4e7ec}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:16px system-ui,-apple-system,'Noto Sans',sans-serif}.wrap{max-width:880px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;padding:24px;border-radius:20px}.hero h1{margin:0 0 7px;font-size:27px}.hero p{margin:0;color:#cbd5e1}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-top:14px;box-shadow:0 4px 16px #10182808}.tabs,.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tabs{margin-top:14px}.tabs button.active{background:#111827;color:white}button,select,input{font:inherit}button{border:0;background:#edf1f7;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:650}button.primary{background:var(--blue);color:white}button.danger{background:#fee4e2;color:#b42318}button:disabled{opacity:.5}select,input[type=search]{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label.field{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.hanzi{font-size:37px;font-weight:750;margin:8px 0}.pinyin{font-size:19px;color:#2563eb}.english{font-size:19px}.item{padding:14px 0;border-bottom:1px solid var(--line)}.choices{display:grid;gap:8px;margin-top:10px}.choice{display:flex;align-items:center;gap:9px;border:1px solid #d0d5dd;border-radius:10px;padding:11px;cursor:pointer}.choice input{accent-color:#2563eb}.correct{background:#effdf4;border-color:#16a34a}.wrong{background:#fef2f2;border-color:#dc2626}.list{max-height:500px;overflow:auto}.pill{background:#eef2ff;border-radius:9px;padding:3px 8px;font-size:12px;color:#4338ca}.notice{margin-top:12px;padding:10px;background:#eff6ff;border-radius:10px}.settings{margin-top:12px}.result{font-size:32px;font-weight:800}.now{padding:18px;background:#f8fafc;border-radius:12px;margin-top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:23px}.hanzi{font-size:32px}}
</style></head><body><main class="wrap"><header class="hero"><h1>中文單字練習 · Learn Chinese</h1><p>Mandarin vocabulary · Listening quiz · Pinyin · Flashcards</p></header><div id="status" class="muted" style="margin:12px 3px">Connecting to Google Sheets…</div><div class="card grid"><div><label class="field">Chinese characters</label><select id="script"><option value="traditional">Traditional (繁體中文)</option><option value="simplified">Simplified (简体中文)</option></select></div><div><label class="field">Mandarin voice</label><select id="voice"><option value="zh-TW">Taiwan Mandarin (台灣)</option><option value="zh-CN">Mainland Mandarin (中国大陆)</option></select></div></div><nav class="tabs"><button class="active" data-tab="quiz">📝 Quiz</button><button data-tab="browse">🔎 Vocabulary</button><button data-tab="listen">🎧 Listening</button><button data-tab="fav">⭐ Favorites</button></nav>
<section id="quiz" class="tab"><div class="card grid"><div><label class="field">Question type</label><select id="mode"><option value="audio">Listen → English meaning</option><option value="hanzi">Chinese → English meaning</option><option value="english">English → Chinese characters</option><option value="pinyin">Chinese → Pinyin</option></select></div><div><label class="field">Number of questions</label><select id="count"><option>10</option><option>20</option><option>30</option><option value="all">All</option></select></div><div><label class="field">Repeat pronunciation</label><select id="repeat"><option>1</option><option selected>2</option><option>3</option></select></div><div><label class="field">Gap between questions</label><select id="gap"><option value="3000">3 seconds</option><option value="5000" selected>5 seconds</option><option value="10000">10 seconds</option></select></div><div><label class="field">Speaking speed</label><select id="rate"><option value="0.7">Slow (0.7×)</option><option value="0.85" selected>Normal learning (0.85×)</option><option value="1">Natural (1×)</option><option value="1.15">Fast (1.15×)</option></select></div></div><div class="card"><div class="row"><button id="start" class="primary">Start quiz & auto-play</button><button id="replay" class="hidden">▶ Replay all</button><button id="pauseQuiz" class="hidden">Pause</button></div><p id="progress" class="muted"></p><div id="questions" class="hidden"></div><div id="results" class="hidden"></div></div></section>
<section id="browse" class="tab hidden"><div class="card"><input id="search" type="search" placeholder="Search Chinese, Pinyin or English…"><p id="searchStat" class="muted"></p><div id="wordList" class="list"></div></div></section>
<section id="listen" class="tab hidden"><div class="card grid"><div><label class="field">Repeat each word</label><select id="listenRepeat"><option>1</option><option selected>2</option><option>3</option></select></div><div><label class="field">Delay between words</label><select id="listenGap"><option value="3000">3 seconds</option><option value="5000" selected>5 seconds</option><option value="10000">10 seconds</option></select></div><div><label class="field">Playback speed</label><select id="listenRate"><option value="0.7">0.7×</option><option value="0.85" selected>0.85×</option><option value="1">1×</option></select></div><div><label class="field">Play order</label><select id="order"><option value="random">Random</option><option value="sheet">Spreadsheet order</option></select></div></div><div class="card"><div class="row"><button id="playAll" class="primary">Start listening</button><button id="pauseAll">Pause</button><button id="stopAll" class="danger">Stop</button></div><p id="listenProgress" class="muted"></p><div id="nowPlaying" class="now">Press Start listening to begin.</div></div></section>
<section id="fav" class="tab hidden"><div class="card"><div class="row"><button id="playFav" class="primary">Listen to favorites</button><button id="clearFav" class="danger">Clear favorites</button></div><div id="favList" class="list"></div></div></section></main>
<script>
'use strict';const SHEET_ID='1-0rKtKo8h4CAB724VMh0mE4aZEK8oqgCvXDcgaSNIy0',SHEET_NAME='中文單字',CACHE='mandarin-vocab-cache-v1',FAV='mandarin-vocab-favorites-v1';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let words=[],quiz=[],quizRunning=false,quizPaused=false,listenRunning=false,listenPaused=false,runToken=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const hanzi=w=>$('#script').value==='traditional'?w.trad:w.simp;const key=w=>w.trad+'|'+w.simp+'|'+w.en;
function normalize(resp){let table=resp?.table,rows=table?.rows||[],cols=(table?.cols||[]).map(c=>String(c.label||'').trim().toLowerCase());let first=rows[0]?.c?.map(c=>String(c?.v??'').trim().toLowerCase())||[];let names=['traditional','simplified','pinyin','english'];let indices=names.map(n=>cols.indexOf(n));let offset=0;if(indices.some(i=>i<0)){indices=names.map(n=>first.indexOf(n));if(indices.every(i=>i>=0))offset=1;else throw Error('Required columns not found: Traditional, Simplified, Pinyin, English')}let seen=new Set();return rows.slice(offset).map(r=>{let c=r.c||[],v=i=>String(c[i]?.v??'').trim();return{trad:v(indices[0]),simp:v(indices[1]),pin:v(indices[2]),en:v(indices[3])}}).filter(w=>{if(!w.trad||!w.simp||!w.pin||!w.en||w.trad.toLowerCase()==='traditional')return false;let k=key(w);if(seen.has(k))return false;seen.add(k);return true})}
function fetchSheet(){return new Promise((resolve,reject)=>{let cb='mandarinCb'+Date.now()+Math.random().toString(36).slice(2),script=document.createElement('script'),done=false;let timer=setTimeout(()=>finish(Error('Connection timed out')),16000);function finish(err,data){if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data)}window[cb]=r=>{try{if(r.status==='error')throw Error(r.errors?.[0]?.message||'Google Sheets error');let a=normalize(r);if(!a.length)throw Error('No Chinese vocabulary rows found');finish(null,a)}catch(e){finish(e)}};script.onerror=()=>finish(Error('Cannot access the Google Sheet'));let tq=encodeURIComponent('select A,B,C,D');script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tq=${tq}&headers=1&tqx=${encodeURIComponent('responseHandler:'+cb)}&_=${Date.now()}`;document.head.appendChild(script)})}
async function load(){try{words=await fetchSheet();try{localStorage.setItem(CACHE,JSON.stringify(words))}catch{}$('#status').textContent=`✓ Google Sheet connected · ${words.length} Chinese words`;renderAll()}catch(e){let c;try{c=JSON.parse(localStorage.getItem(CACHE)||'null')}catch{}if(c?.length){words=c;$('#status').textContent=`⚠ Offline cached vocabulary · ${words.length} words`;renderAll()}else $('#status').innerHTML=`Unable to load Google Sheet: ${esc(e.message)}. Make sure the spreadsheet is shared for viewing. <button id="retry">Retry</button>`,$('#retry').onclick=load}}
function voiceLang(){return $('#voice').value}function speak(t,rate=.85,lang=voiceLang()){return new Promise(resolve=>{if(!('speechSynthesis'in window)){resolve();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=+rate;let vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase()===lang.toLowerCase())||vs.find(x=>x.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}async function repeatWord(w,n,rate,token){for(let i=0;i<n&&token===runToken;i++){await speak(hanzi(w),rate);if(i<n-1&&token===runToken)await wait(650)}}function stop(){runToken++;quizRunning=false;listenRunning=false;quizPaused=false;listenPaused=false;speechSynthesis.cancel()}
function getFav(){try{return JSON.parse(localStorage.getItem(FAV)||'[]')}catch{return[]}}function isFav(w){return getFav().some(x=>key(x)===key(w))}function toggleFav(i){let w=words[i],a=getFav(),k=key(w),j=a.findIndex(x=>key(x)===k);j>=0?a.splice(j,1):a.unshift(w);localStorage.setItem(FAV,JSON.stringify(a));renderAll()}function card(w,i){return `<div class="item"><div class="row"><strong class="hanzi" style="font-size:25px">${esc(hanzi(w))}</strong><button data-speak="${i}">🔊</button><button data-fav="${i}">${isFav(w)?'★ Saved':'☆ Save'}</button></div><div class="pinyin">${esc(w.pin)}</div><div>${esc(w.en)}</div><small class="muted">${esc(w.trad)} · ${esc(w.simp)}</small></div>`}function renderList(){let q=$('#search').value.trim().toLowerCase(),a=words.map((w,i)=>({...w,index:i})).filter(w=>[w.trad,w.simp,w.pin,w.en].some(v=>v.toLowerCase().includes(q)));$('#searchStat').textContent=`${a.length} matching words`;$('#wordList').innerHTML=a.slice(0,500).map(w=>card(w,w.index)).join('')+(a.length>500?'<p class="muted">Showing the first 500 results. Use search to narrow down.</p>':'')}function renderFav(){let f=getFav();$('#favList').innerHTML=f.length?f.map(w=>{let i=words.findIndex(x=>key(x)===key(w));return i>=0?card(words[i],i):`<div class="item">${esc(w.trad)} · ${esc(w.en)}</div>`}).join(''):'<p class="muted">No saved words yet.</p>'}function renderAll(){renderList();renderFav()}
function target(w,mode){return mode==='english'?hanzi(w):mode==='pinyin'?w.pin:w.en}function promptWord(w,mode){return mode==='audio'?'<span class="muted">🎧 Listen to the pronunciation</span>':mode==='english'?esc(w.en):`<span class="hanzi">${esc(hanzi(w))}</span>`}function startQuiz(){if(words.length<2)return alert('At least two words are needed');stop();let n=$('#count').value==='all'?words.length:Math.min(+$('#count').value,words.length),mode=$('#mode').value;quiz=shuffle(words).slice(0,n);$('#results').classList.add('hidden');$('#questions').classList.remove('hidden');$('#replay').classList.remove('hidden');$('#pauseQuiz').classList.remove('hidden');$('#pauseQuiz').textContent='Pause';$('#questions').innerHTML=quiz.map((w,i)=>{let right=target(w,mode),others=shuffle(words.filter(x=>target(x,mode)!==right)).map(x=>target(x,mode));let opts=shuffle([right,...[...new Set(others)].slice(0,3)]);return `<div class="item" id="q${i}"><div class="row"><b>Question ${i+1}</b><button data-qplay="${i}">🔊 Listen</button></div><div style="margin:10px 0">${promptWord(w,mode)}</div><div class="choices">${opts.map((o,j)=>`<label class="choice"><input type="radio" name="answer${i}" value="${j}" data-answer="${esc(o)}"> ${esc(o)}</label>`).join('')}</div></div>`}).join('')+'<button id="submit" class="primary" style="margin-top:16px">Submit answers</button>';$('#submit').onclick=submitQuiz;playQuiz()}
async function playQuiz(){if(quizRunning)return;let token=++runToken;quizRunning=true;quizPaused=false;$('#pauseQuiz').textContent='Pause';for(let i=0;i<quiz.length&&token===runToken;i++){while(quizPaused&&token===runToken)await wait(150);if(token!==runToken)break;$('#progress').textContent=`Playing question ${i+1} / ${quiz.length}`;let el=$('#q'+i);if(el)el.style.outline='2px solid #93c5fd';await speak('Question '+(i+1),.95,'en-US');if(token!==runToken)break;await wait(450);await repeatWord(quiz[i],+$('#repeat').value,+$('#rate').value,token);if(el)el.style.outline='';let remaining=+$('#gap').value;while(remaining>0&&token===runToken){if(quizPaused){await wait(150);continue}await wait(150);remaining-=150}}if(token===runToken){quizRunning=false;$('#progress').textContent=`All ${quiz.length} questions played. You can answer or replay.`}}
function submitQuiz(){stop();let mode=$('#mode').value,correct=0;let html=quiz.map((w,i)=>{let el=document.querySelector(`input[name="answer${i}"]:checked`),answer=el?.dataset.answer||'',right=target(w,mode),ok=answer===right;if(ok)correct++;return `<div class="item"><b>Question ${i+1}: ${ok?'✓ Correct':'✗ Incorrect'}</b><div class="hanzi" style="font-size:26px">${esc(hanzi(w))}</div><div class="pinyin">${esc(w.pin)}</div><div>${esc(w.en)}</div><div class="muted">Correct answer: ${esc(right)}${ok?'':` · Your answer: ${esc(answer||'Not answered')}`}</div><button data-review="${i}">🔊 Pronunciation</button></div>`}).join('');$('#questions').classList.add('hidden');$('#replay').classList.add('hidden');$('#pauseQuiz').classList.add('hidden');$('#progress').textContent='';$('#results').classList.remove('hidden');$('#results').innerHTML=`<div class="result">${correct} / ${quiz.length}</div><p>Score: ${Math.round(correct/quiz.length*100)}%</p>${html}<button id="again" class="primary">Try again</button>`;$('#again').onclick=startQuiz}
async function playSequence(arr){if(!arr.length)return alert('No words to play');stop();let token=++runToken;listenRunning=true;listenPaused=false;$('#pauseAll').textContent='Pause';for(let i=0;i<arr.length&&token===runToken;i++){while(listenPaused&&token===runToken)await wait(150);if(token!==runToken)break;let w=arr[i];$('#listenProgress').textContent=`Word ${i+1} / ${arr.length}`;$('#nowPlaying').innerHTML=`<div class="hanzi">${esc(hanzi(w))}</div><div class="pinyin">${esc(w.pin)}</div><div class="english">${esc(w.en)}</div>`;await repeatWord(w,+$('#listenRepeat').value,+$('#listenRate').value,token);let remaining=+$('#listenGap').value;while(remaining>0&&token===runToken){if(listenPaused){await wait(150);continue}await wait(150);remaining-=150}}if(token===runToken){listenRunning=false;$('#listenProgress').textContent='Listening complete'}}
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('active',x===b));$$('.tab').forEach(x=>x.classList.add('hidden'));$('#'+b.dataset.tab).classList.remove('hidden')});$('#start').onclick=startQuiz;$('#replay').onclick=()=>{if(!quizRunning)playQuiz()};$('#pauseQuiz').onclick=()=>{if(!quizRunning)return;quizPaused=!quizPaused;$('#pauseQuiz').textContent=quizPaused?'Resume':'Pause';quizPaused?speechSynthesis.pause():speechSynthesis.resume()};$('#search').oninput=renderList;$('#script').onchange=()=>{stop();renderAll();if(quiz.length&&!$('#questions').classList.contains('hidden'))startQuiz()};$('#playAll').onclick=()=>playSequence($('#order').value==='random'?shuffle(words):words);$('#pauseAll').onclick=()=>{if(!listenRunning)return;listenPaused=!listenPaused;$('#pauseAll').textContent=listenPaused?'Resume':'Pause';listenPaused?speechSynthesis.pause():speechSynthesis.resume()};$('#stopAll').onclick=()=>{stop();$('#listenProgress').textContent='Stopped'};$('#playFav').onclick=()=>{$$('[data-tab="listen"]')[0].click();playSequence(getFav())};$('#clearFav').onclick=()=>{if(confirm('Clear all saved words?')){localStorage.removeItem(FAV);renderAll()}};document.addEventListener('click',e=>{let t=e.target.closest('[data-speak],[data-fav],[data-qplay],[data-review]');if(!t)return;if(t.dataset.speak!==undefined)speak(hanzi(words[+t.dataset.speak]));if(t.dataset.fav!==undefined)toggleFav(+t.dataset.fav);if(t.dataset.qplay!==undefined)repeatWord(quiz[+t.dataset.qplay],+$('#repeat').value,+$('#rate').value,runToken);if(t.dataset.review!==undefined)speak(hanzi(quiz[+t.dataset.review]))});load();
</script></body></html>
